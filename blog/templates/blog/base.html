{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}{% endblock title %}</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css" integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="stylesheet" href="{% static 'blog/css/base.css' %}">
    <link rel="shortcut icon" href="{% static 'Standard_favicon.png' %}" type="image/x-icon">
    {% block add_static %}{% endblock add_static %}
  </head>
  <body>
    <nav>
      <div class="container">
        <a href="{% url "blog:home" %}">
          <i class="fa-solid fa-house"></i>
          <div class="absolute">Home</div>
        </a>
        
      </div>
      <div class="container">
        <a href="">
          <i class="fa-notdog-duo fa-solid fa-plus"></i>
          <div class="absolute">Create Post</div>
        </a>
      </div>
      {% comment %} {% url "blog:create_post" %} {% endcomment %}
    </nav>

    <main>
      {% block content %}{% endblock content %}
    </main>

    {% block script %}{% endblock script %}
  </body>
</html>
