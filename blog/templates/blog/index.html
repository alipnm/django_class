{% extends 'blog/base.html' %}
{% load static %}

{% block title %}
  Home page
{% endblock %}

{% block add_static %}
  <link rel="stylesheet" href="{% static 'blog/css/style.css' %}" />
{% endblock %}

{% block content %}
  <h1 id="superheader">Welcome To My Site!</h1>
  <div id="searchbar">
    <input type="text" name="search" id="searchInput" placeholder="Search Posts..." />
    <button id="searchButton">
      <i class="fa-duotone fa-solid fa-magnifying-glass"></i>
      <span>Search</span>
    </button>
    <button id="showAll" class="button">Show All Posts</button>
  </div>
  <h1 id="searchResult"></h1>
  <div id="posts"></div>
{% endblock %}

{% block script %}
  <script src="{% static 'blog/js/script.js' %}"></script>
{% endblock %}
